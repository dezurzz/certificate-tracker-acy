<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Login - BKI Academy CMS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "background": "#f7f9fb",
                        "on-tertiary-fixed": "#0b1c30",
                        "on-surface-variant": "#45464d",
                        "tertiary-container": "#0b1c30",
                        "primary-fixed": "#dae2fd",
                        "surface-container-highest": "#e0e3e5",
                        "primary-container": "#131b2e",
                        "on-error-container": "#93000a",
                        "on-background": "#191c1e",
                        "inverse-surface": "#2d3133",
                        "on-tertiary-fixed-variant": "#38485d",
                        "on-primary-container": "#7c839b",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "secondary-fixed-dim": "#adc6ff",
                        "surface-dim": "#d8dadc",
                        "on-secondary-fixed": "#001a42",
                        "on-tertiary-container": "#75859d",
                        "secondary-container": "#2170e4",
                        "secondary-fixed": "#d8e2ff",
                        "primary-fixed-dim": "#bec6e0",
                        "outline-variant": "#c6c6cd",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#3f465c",
                        "surface-tint": "#565e74",
                        "secondary": "#0058be",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#191c1e",
                        "on-secondary-container": "#fefcff",
                        "surface-variant": "#e0e3e5",
                        "tertiary-fixed": "#d3e4fe",
                        "surface-bright": "#f7f9fb",
                        "primary": "#000000",
                        "surface-container-low": "#f2f4f6",
                        "outline": "#76777d",
                        "surface-container": "#eceef0",
                        "inverse-on-surface": "#eff1f3",
                        "surface-container-high": "#e6e8ea",
                        "inverse-primary": "#bec6e0",
                        "on-secondary-fixed-variant": "#004395",
                        "surface": "#f7f9fb",
                        "on-primary": "#ffffff",
                        "tertiary": "#000000",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#131b2e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "32px",
                        "container-padding": "24px",
                        "stack-sm": "8px",
                        "gutter": "16px",
                        "unit": "4px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "title-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "mono-label": ["Inter"],
                        "body-md": ["Inter"],
                        "label-caps": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "400" }],
                        "title-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "mono-label": ["12px", { "lineHeight": "16px", "letterSpacing": "0em", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #F8FAFC; /* Base Level 0 */
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-on-surface font-body-md bg-background">
<!-- Suppress navigation shell as this is a linear/transactional intent page (Login) -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm overflow-hidden flex flex-col">
<!-- Header / Logo Area -->
<div class="pt-stack-lg pb-stack-md px-container-padding flex flex-col items-center text-center border-b border-surface-container-high">
<div class="w-16 h-16 rounded-lg bg-primary-container flex items-center justify-center mb-stack-md">
<span class="material-symbols-outlined text-on-primary-container text-4xl" data-icon="school" data-weight="fill">school</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary mb-unit">BKI Academy</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Management System</p>
</div>
<!-- Login Form -->
<div class="p-container-padding flex-1">
<form action="#" class="space-y-stack-md" method="POST">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-unit" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors duration-200" id="email" name="email" placeholder="admin@bkiacademy.edu" type="email">
</div>
</div>
<div>
<div class="flex items-center justify-between mb-unit">
<label class="block font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label>
<a class="font-body-sm text-body-sm text-secondary hover:text-secondary-container transition-colors duration-200" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors duration-200" id="password" name="password" placeholder="••••••••" type="password">
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer">
<span class="material-symbols-outlined text-outline hover:text-on-surface-variant text-lg" data-icon="visibility_off">visibility_off</span>
</div>
</div>
</div>
<div class="flex items-center pt-unit">
<input class="h-4 w-4 text-secondary focus:ring-secondary border-outline-variant rounded bg-surface-container-lowest" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                        Remember me for 30 days
                    </label>
</div>
<div class="pt-stack-sm">
<button class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm font-title-sm text-title-sm text-on-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 transition-colors duration-200 relative group overflow-hidden bg-primary hover:bg-secondary-container focus:ring-secondary" type="submit">
<span class="absolute inset-0 w-full h-full border border-white/20 rounded-lg pointer-events-none group-hover:border-white/40 transition-colors"></span>
                        Sign In
                    </button>
</div>
</form>
</div>
<!-- Footer / Support -->
<div class="bg-surface-container-low px-container-padding py-stack-md text-center border-t border-surface-container-high rounded-b-xl">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Need help? <a class="font-body-sm text-body-sm text-secondary hover:underline" href="#">Contact IT Support</a>
</p>
</div>
</div>


</body></html>
