<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History Logs - BKI Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="shared/style.css">
  <script src="shared/db.js"></script>
  <script src="shared/components.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex min-h-screen">
  <!-- Sidebar Component (dynamically injected) -->
  <aside id="sidebar-container"></aside>

  <!-- Main Content Wrapper -->
  <div class="flex-1 ml-60 flex flex-col min-h-screen">
    <!-- TopNavBar Component (dynamically injected) -->
    <header id="header-container" data-title="History Logs"></header>

    <!-- Page Content -->
    <main class="flex-grow p-6 max-w-[1440px] mx-auto w-full">
      <!-- Page Header -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
        <div>
          <h2 class="text-3xl font-bold text-slate-800 tracking-tight">Audit History Logs</h2>
          <p class="text-sm text-slate-500 mt-1">Trace all training deployments and certificate status updates.</p>
        </div>
        <div class="flex gap-3">
          <button onclick="exportHistoryCSV()" class="cms-btn-secondary h-10 shadow-sm">
            <span class="material-symbols-outlined text-[18px]">download</span>
            Export Audit Trail
          </button>
        </div>
      </div>

      <!-- Controls & Grouping Filter -->
      <div class="bg-white rounded-xl border border-slate-200 p-4 flex flex-col md:flex-row gap-4 items-center justify-between shadow-sm mb-8">
        <div class="relative w-full md:w-80">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[18px]">search</span>
          <input id="history-search" class="w-full h-9 pl-9 pr-3 rounded-lg border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/15 transition-all text-slate-800" placeholder="Search logs..." type="text">
        </div>

        <div class="flex items-center gap-3 w-full md:w-auto justify-end">
          <label class="text-xs font-bold text-slate-400 uppercase tracking-wider whitespace-nowrap">Group By</label>
          <select id="group-by-select" class="h-9 rounded-lg border border-slate-200 bg-slate-50 text-sm text-slate-700 px-3 py-0 focus:outline-none focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/15 min-w-[180px] appearance-none cursor-pointer">
            <option value="time">📅 Group by Time</option>
            <option value="pic">👤 Group by PIC (Operator)</option>
            <option value="training">🏫 Group by Training Batch</option>
          </select>
        </div>
      </div>

      <!-- History List Output -->
      <div id="history-output-container" class="flex flex-col gap-8">
        <!-- Rendered group cards will append here -->
      </div>
    </main>
  </div>

  <script>
    let rawActivities = [];

    function formatRelativeTime(date) {
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMins / 60);
      const diffDays = Math.floor(diffHours / 24);

      if (diffMins < 1) return 'Just now';
      if (diffMins < 60) return `${diffMins} min${diffMins > 1 ? 's' : ''} ago`;
      if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
      if (diffDays === 1) return 'Yesterday';
      return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function getGroupTimeLabel(date) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);
      
      const itemDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

      if (itemDate.getTime() === today.getTime()) return 'Today';
      if (itemDate.getTime() === yesterday.getTime()) return 'Yesterday';
      
      const oneWeekAgo = new Date(today);
      oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
      if (date >= oneWeekAgo) return 'This Week';
      
      return 'Older Logs';
    }

    async function loadLogs() {
      if (typeof DB === 'undefined') return;

      const trainings = await DB.getTrainings();
      const certificates = await DB.getCertificates();

      rawActivities = [];

      // Add training created activities
      trainings.forEach(t => {
        rawActivities.push({
          id: `t-${t.id}`,
          type: 'training_created',
          title: 'Training Batch Created',
          desc: `Program batch <span class="font-semibold text-slate-800">${t.program_name}</span> (${t.batch_code}) was initialized.`,
          time: t.created_at ? new Date(t.created_at) : (t.start_date ? new Date(t.start_date) : new Date()),
          pic: t.pic || 'System',
          trainingName: `${t.program_name} (${t.batch_code})`,
          dotColor: 'bg-blue-600',
          badgeClass: 'bg-blue-50 text-blue-700 border-blue-100'
        });
      });

      // Add certificate transitions
      certificates.forEach(c => {
        const name = c.participants ? c.participants.name : 'Unknown';
        const trainingName = c.trainings ? `${c.trainings.program_name} (${c.trainings.batch_code})` : 'Unknown Training';
        
        // 1. Initial Generation Event
        rawActivities.push({
          id: `c-gen-${c.id}`,
          type: 'certificate_created',
          title: 'Certificate Generated',
          desc: `Certificate draft generated for <span class="font-semibold text-slate-800">${name}</span> (${c.certificate_type}).`,
          time: c.created_at ? new Date(c.created_at) : new Date(),
          pic: c.updated_by || 'System',
          trainingName: trainingName,
          dotColor: 'bg-slate-300',
          badgeClass: 'bg-slate-50 text-slate-500 border-slate-100'
        });

        // 2. Printing Action Event
        if (c.printed_at) {
          rawActivities.push({
            id: `c-print-${c.id}`,
            type: 'certificate_printed',
            title: 'Certificate Printed',
            desc: `Physical certificate printed and checked for <span class="font-semibold text-slate-800">${name}</span> (${c.certificate_type}).`,
            time: new Date(c.printed_at),
            pic: c.printed_by || 'Admin',
            trainingName: trainingName,
            dotColor: 'bg-amber-500',
            badgeClass: 'bg-amber-50 text-amber-700 border-amber-100'
          });
        }

        // 3. Sent / Shipping Event
        if (c.sent_at) {
          rawActivities.push({
            id: `c-sent-${c.id}`,
            type: 'certificate_sent',
            title: 'Certificate Shipped',
            desc: `Certificate package dispatched and signed for <span class="font-semibold text-slate-800">${name}</span> (${c.certificate_type}).`,
            time: new Date(c.sent_at),
            pic: c.sent_by || 'Admin',
            trainingName: trainingName,
            dotColor: 'bg-green-500',
            badgeClass: 'bg-green-50 text-green-700 border-green-100'
          });
        }
      });

      renderLogs();
    }

    function renderLogs() {
      const searchVal = document.getElementById('history-search').value.toLowerCase();
      const groupBy = document.getElementById('group-by-select').value;
      const container = document.getElementById('history-output-container');
      container.innerHTML = '';

      // Filter activities first
      const filtered = rawActivities.filter(act => {
        return act.title.toLowerCase().includes(searchVal) ||
               act.desc.toLowerCase().includes(searchVal) ||
               act.pic.toLowerCase().includes(searchVal) ||
               act.trainingName.toLowerCase().includes(searchVal);
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-xl border border-slate-200 p-12 text-center shadow-sm">
            <div class="flex flex-col items-center justify-center gap-3">
              <span class="material-symbols-outlined text-4xl text-slate-300">history</span>
              <p class="text-sm font-semibold text-slate-700">No logs found</p>
              <p class="text-xs text-slate-400">Try adjusting your search criteria or record new operations.</p>
            </div>
          </div>
        `;
        return;
      }

      // Sort chronological descending
      filtered.sort((a, b) => b.time - a.time);

      // Group activities
      const groups = {};
      filtered.forEach(act => {
        let key = '';
        if (groupBy === 'time') {
          key = getGroupTimeLabel(act.time);
        } else if (groupBy === 'pic') {
          key = act.pic || 'System / Batch';
        } else if (groupBy === 'training') {
          key = act.trainingName || 'Unassociated';
        }

        if (!groups[key]) groups[key] = [];
        groups[key].push(act);
      });

      // Render grouped boxes
      const keys = Object.keys(groups);
      if (groupBy === 'time') {
        const order = ['Today', 'Yesterday', 'This Week', 'Older Logs'];
        keys.sort((a, b) => order.indexOf(a) - order.indexOf(b));
      } else {
        keys.sort();
      }

      keys.forEach(groupKey => {
        const items = groups[groupKey];
        if (!items || items.length === 0) return;

        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden';
        
        card.innerHTML = `
          <div class="px-6 py-4 bg-slate-50/70 border-b border-slate-200 flex justify-between items-center select-none">
            <span class="text-xs font-bold text-slate-600 uppercase tracking-wider">${groupKey}</span>
            <span class="text-[10px] bg-slate-200 text-slate-600 font-bold px-2 py-0.5 rounded-full">${items.length} Event(s)</span>
          </div>
          <div class="p-6">
            <div class="relative before:absolute before:inset-y-0 before:left-3 before:w-px before:bg-slate-100 flex flex-col gap-6">
              ${items.map(item => `
                <div class="relative pl-8 flex justify-between items-start animate-in fade-in duration-150">
                  <div class="absolute left-[8px] top-1.5 w-2 h-2 rounded-full ${item.dotColor} ring-4 ring-white"></div>
                  <div class="flex-grow">
                    <p class="text-sm font-semibold text-slate-800 leading-snug">${item.title}</p>
                    <p class="text-xs text-slate-500 mt-1">${item.desc}</p>
                    <div class="flex items-center gap-4 mt-2 text-[10px] text-slate-400 font-semibold uppercase tracking-wider">
                      <span class="flex items-center gap-1">
                        <span class="material-symbols-outlined text-xs">person</span>
                        ${item.pic}
                      </span>
                      <span class="flex items-center gap-1">
                        <span class="material-symbols-outlined text-xs">school</span>
                        ${item.trainingName}
                      </span>
                    </div>
                  </div>
                  <div class="text-right shrink-0 flex flex-col items-end gap-1.5">
                    <span class="cms-badge ${item.badgeClass} text-[9px] uppercase tracking-wider">${item.type.split('_').pop()}</span>
                    <span class="text-[10px] text-slate-400 font-medium">${formatRelativeTime(item.time)}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function exportHistoryCSV() {
      if (rawActivities.length === 0) return;
      let csv = "ID,Timestamp,Type,Event,PIC,Training\n";
      rawActivities.forEach(act => {
        const timeStr = act.time.toISOString();
        const descText = act.desc.replace(/<[^>]*>/g, '').replace(/,/g, ';');
        csv += `"${act.id}","${timeStr}","${act.type}","${descText}","${act.pic}","${act.trainingName}"\n`;
      });
      
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", `bki-audit-logs-${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    document.getElementById('history-search').addEventListener('keyup', renderLogs);
    document.getElementById('group-by-select').addEventListener('change', renderLogs);

    window.addEventListener('DOMContentLoaded', loadLogs);
  </script>
</body>
</html>
